services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    volumes:
      - type: bind
        source: ${MODEL_FILE:-./artifacts/financial_exclusion_pipeline.joblib}
        target: /app/artifacts/financial_exclusion_pipeline.joblib
        read_only: true
        bind:
          create_host_path: false
    environment:
      PORT: "8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3).close()"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-8080}:80"
    environment:
      PORT: "80"
      API_UPSTREAM: backend:8000
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q --spider http://127.0.0.1/api/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
