services:
  - type: web
    name: financial-exclusion-api
    runtime: image
    plan: free
    image:
      url: ghcr.io/assumptamw/financial-exclusion-capstone-api:main
      creds:
        fromRegistryCreds:
          name: financial-exclusion-ghcr
    healthCheckPath: /health

  - type: web
    name: financial-exclusion-ui
    runtime: image
    plan: free
    image:
      url: ghcr.io/assumptamw/financial-exclusion-capstone-frontend:main
      creds:
        fromRegistryCreds:
          name: financial-exclusion-ghcr
    healthCheckPath: /
    envVars:
      - key: API_UPSTREAM
        fromService:
          type: web
          name: financial-exclusion-api
          property: hostport
