server {
    listen ${PORT};
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    location /api/ {
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # FastAPI's Swagger UI loads /openapi.json and calls its documented paths.
    location ~ ^/(docs|redoc|openapi\.json|health|predict|predict/batch)$ {
        proxy_pass http://${API_UPSTREAM};
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
